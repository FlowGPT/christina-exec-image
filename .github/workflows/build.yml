name: build

# 构建并发布 ghcr.io/flowgpt/christina-exec-image。
# - 只有 main 上的提交会发布；要试一版就用 workflow_dispatch 指定分支。
# - 两道密钥扫描（trivy，按 digest 钉版本）：先扫仓库文件，再扫构建出的整个镜像；任何一条命中就失败、不推。
# - 标签是「构建日期-提交号」，不推 latest：用的人自己钉版本。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/flowgpt/christina-exec-image
      TRIVY: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Secret scan (repository files)
        run: docker run --rm -v "$PWD:/src:ro" "$TRIVY" fs --scanners secret --exit-code 1 --no-progress /src

      - name: Tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null || true
          df -h /

      - name: Build
        run: docker build --pull -t "$IMAGE:${{ steps.tag.outputs.tag }}" .

      - name: Smoke test (imports and a few real calls; any failure stops the push)
        run: |
          docker run --rm -i -w /tmp "$IMAGE:${{ steps.tag.outputs.tag }}" python3 - <<'PY'
          import importlib, subprocess, sys
          mods = ["numpy", "pandas", "scipy", "matplotlib", "PIL", "requests", "httpx", "openpyxl", "sklearn",
                  "statsmodels", "duckdb", "pyarrow", "sqlalchemy", "psycopg2", "pymysql", "yaml", "bs4", "lxml",
                  "pymupdf", "pypdf", "fontTools", "tiktoken", "langdetect", "websocket", "fastapi", "uvicorn",
                  "pytest", "tqdm", "torch", "torchaudio", "torchvision", "torchcodec", "whisper", "faster_whisper",
                  "demucs", "librosa", "soundfile", "silero_vad", "onnxruntime", "rembg", "spandrel", "ultralytics",
                  "transformers", "yt_dlp", "cairosvg", "segno", "cv2", "av", "playwright", "ctranslate2", "numba"]
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except BaseException as e:
                  bad.append(f"import {m}: {type(e).__name__}: {e}")
          subprocess.run(["ffmpeg", "-v", "error", "-f", "lavfi", "-i", "sine=frequency=440:duration=1", "-y", "t.wav"], check=True)
          checks = {
              "faster_whisper.decode_audio": lambda: __import__("faster_whisper.audio", fromlist=["x"]).decode_audio("t.wav"),
              "torchaudio.load": lambda: __import__("torchaudio").load("t.wav"),
              "librosa.load": lambda: __import__("librosa").load("t.wav"),
              "playwright chromium": lambda: subprocess.run(["python3", "-c", "from playwright.sync_api import sync_playwright as p\nwith p() as x: b=x.chromium.launch(); b.close()"], check=True),
          }
          for name, fn in checks.items():
              try:
                  fn()
              except BaseException as e:
                  bad.append(f"{name}: {type(e).__name__}: {e}")
          print("\n".join(bad) or "smoke ok")
          sys.exit(1 if bad else 0)
          PY

      # 以镜像默认用户（uid 1000，和集群里一样）跑 claude --version，必须等于 Dockerfile 里钉的版本。
      - name: Smoke test (claude --version equals ARG CLAUDE_CODE_VERSION)
        run: |
          want=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' Dockerfile)
          got=$(docker run --rm -w /tmp "$IMAGE:${{ steps.tag.outputs.tag }}" claude --version)
          echo "Dockerfile: $want / image: $got"
          [ -n "$want" ] && [ "${got%% *}" = "$want" ]

      - name: Secret scan (image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners secret --exit-code 1 --no-progress "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          echo "pushed $IMAGE:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
