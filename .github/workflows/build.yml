name: build

# 构建并发布 ghcr.io/flowgpt/christina-exec-image。
# - 只有 main 上的提交会发布；要试一版就用 workflow_dispatch 指定分支。
# - 两道密钥扫描（trivy，按 digest 钉版本）：先扫仓库文件，再扫构建出的整个镜像；任何一条命中就失败、不推。
# - 标签是「构建日期-提交号」，不推 latest：用的人自己钉版本。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/flowgpt/christina-exec-image
      TRIVY: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Secret scan (repository files)
        run: docker run --rm -v "$PWD:/src:ro" "$TRIVY" fs --scanners secret --exit-code 1 --no-progress /src

      - name: Tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null || true
          df -h /

      - name: Build
        run: docker build --pull -t "$IMAGE:${{ steps.tag.outputs.tag }}" .

      - name: Secret scan (image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners secret --exit-code 1 --no-progress "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          echo "pushed $IMAGE:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
