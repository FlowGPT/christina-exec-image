name: build

# 构建并发布两个镜像：
# - ghcr.io/flowgpt/christina-exec-image：通用镜像（Dockerfile）。
# - ghcr.io/flowgpt/christina-exec-job：工单镜像（job/Dockerfile），在钉死的某版通用镜像上加 postgres+pgvector、redis、caddy、cloudflared。
# 规则：
# - push 到 main：构建、冒烟、扫描，全过才发布。
# - 手动跑（workflow_dispatch，可指定分支）：默认只构建、冒烟、扫描，不推；publish 选 true 才推。
# - 两道密钥扫描（trivy，按 digest 钉版本）：先扫仓库文件，再扫构建出的每个镜像；任何一条命中就失败、不推。
# - 冒烟测试有一项失败就不推。
# - 标签是「构建日期-提交号」，同一次构建两个镜像用同一个标签；不推 latest，用的人自己钉版本。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 推到 ghcr（false 只构建、冒烟、扫描）
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Secret scan (repository files)
        run: docker run --rm -v "$PWD:/src:ro" "$TRIVY" fs --scanners secret --exit-code 1 --no-progress /src

      - name: Tag and publish decision
        id: tag
        run: |
          echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "publish=${{ github.event_name == 'push' || inputs.publish }}" >> "$GITHUB_OUTPUT"

  exec-image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/flowgpt/christina-exec-image
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null || true
          df -h /

      - name: Build
        run: docker build --pull -t "$IMAGE:$TAG" .

      - name: Smoke test (imports and a few real calls; any failure stops the push)
        run: docker run --rm -i -w /tmp "$IMAGE:$TAG" python3 - < smoke/exec.py

      # 以镜像默认用户（uid 1000，和集群里一样）跑 claude --version，必须等于 Dockerfile 里钉的版本。
      - name: Smoke test (claude --version equals ARG CLAUDE_CODE_VERSION)
        run: |
          want=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' Dockerfile)
          got=$(docker run --rm -w /tmp "$IMAGE:$TAG" claude --version)
          echo "Dockerfile: $want / image: $got"
          [ -n "$want" ] && [ "${got%% *}" = "$want" ]

      - name: Secret scan (image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners secret --exit-code 1 --no-progress "$IMAGE:$TAG"

      - name: Size
        run: |
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE:$TAG")
          echo "$IMAGE:$TAG 解压后 $((size / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push
        if: needs.prepare.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          echo "pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"

  job-image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/flowgpt/christina-exec-job
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null || true
          df -h /

      # 构建上下文只有 job/ 目录（Dockerfile、依赖清单副本、boot 脚本、一句话的壳）；基础镜像是 job/Dockerfile 里钉死的那版通用镜像。
      - name: Build
        run: docker build --pull -t "$IMAGE:$TAG" job/

      - name: Smoke test (postgres+pgvector, redis, caddy, cloudflared as uid 1001)
        run: docker run --rm -i "$IMAGE:$TAG" bash -s < smoke/job.sh

      # pod 运行环境，以镜像默认用户（uid 1001，和 pod 规格里一样）跑：PATH 上的 claude 和 venv 里 SDK 随包的 claude
      # 都要等于通用镜像 Dockerfile 钉的版本；agent-browser 带 --no-sandbox 开一页、点一下；venv 的 playwright 起得来；
      # kubectl / aws / docker 三个壳只说一句话；启动链要写的目录对 uid 1001 可写。
      - name: Smoke test (pod runtime as uid 1001)
        run: |
          want=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' Dockerfile)
          docker run --rm -i --shm-size=1g -e WANT_CLAUDE="$want" "$IMAGE:$TAG" bash -s < smoke/pod.sh

      # christina-pod-boot 对一个假的单面 API：sha256 不对、依赖不符、401、正常、命中缓存、钉的版本不留了、跳转。
      - name: Smoke test (christina-pod-boot against a fake plane)
        run: docker run --rm -i "$IMAGE:$TAG" python3 - < smoke/pod_boot.py

      - name: Smoke test (generic image checks still pass)
        run: docker run --rm -i -w /tmp "$IMAGE:$TAG" python3 - < smoke/exec.py

      - name: Secret scan (image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners secret --exit-code 1 --no-progress "$IMAGE:$TAG"

      - name: Size
        run: |
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE:$TAG")
          echo "$IMAGE:$TAG 解压后 $((size / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      # 推完按 registry 里的清单报压缩后大小：首次拉取的总量，以及节点上已有那版通用镜像时只需拉的增量。
      # 报大小只是信息，失败不影响发布结果。
      - name: Push
        if: needs.prepare.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          echo "pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          docker manifest inspect "$(sed -n 's/^ARG BASE=//p' job/Dockerfile)" > base.json \
            && docker manifest inspect "$IMAGE:$TAG" > job.json \
            && line=$(jq -r --slurpfile b base.json '
                 [$b[0].layers[].digest] as $base
                 | "压缩后共 \(([.layers[].size] | add) / 1e6 | floor) MB；"
                   + "节点已有这版通用镜像时只拉增量 \(([.layers[] | select((.digest | IN($base[])) | not) | .size] | add // 0) / 1e6 | floor) MB"
               ' job.json) \
            && echo "$line" | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo "size report skipped"
